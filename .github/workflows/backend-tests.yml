name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - master

permissions:
  contents: read

jobs:
  pytest:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Run backend tests
        run: uv run pytest tests/backend

  frontend:
    name: Frontend syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check health dashboard JavaScript
        run: node --check calorie-tracker/frontend/health.js

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs:
      - pytest
      - frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./calorie-tracker/Dockerfile
          platforms: linux/amd64
          push: false
          tags: food-reader:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
