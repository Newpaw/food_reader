name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --all-groups

      - name: Backend tests
        id: backend
        continue-on-error: true
        run: |
          set -o pipefail
          uv run pytest -q 2>&1 | tee pytest.log

      - uses: actions/setup-node@v4
        if: always()
        with:
          node-version: '22'
      - name: Install frontend dependencies
        if: always()
        working-directory: calorie-tracker/frontend
        run: npm ci
      - name: Frontend tests
        id: frontend
        if: always()
        continue-on-error: true
        working-directory: calorie-tracker/frontend
        run: |
          set -o pipefail
          npm test 2>&1 | tee ../../frontend-test.log

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            pytest.log
            frontend-test.log
          if-no-files-found: warn

      - name: Enforce test results
        if: always()
        env:
          BACKEND_OUTCOME: ${{ steps.backend.outcome }}
          FRONTEND_OUTCOME: ${{ steps.frontend.outcome }}
        run: |
          test "$BACKEND_OUTCOME" = success
          test "$FRONTEND_OUTCOME" = success
