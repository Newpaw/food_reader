name: Release container

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: food-reader-container-release
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/newpaw/food_reader

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Run backend tests
        run: uv run pytest tests/backend

  frontend:
    name: Frontend syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check frontend JavaScript
        run: |
          node --check calorie-tracker/frontend/navigation.js
          node --check calorie-tracker/frontend/mobile-ux.js
          node --check calorie-tracker/frontend/health.js
          node --check calorie-tracker/frontend/assistant.js
          node --check calorie-tracker/frontend/service-worker.js

      - name: Check navigation integration
        run: python tests/frontend/test_navigation.py

  publish:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    needs:
      - test
      - frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./calorie-tracker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Release summary
        run: |
          echo "### Food Reader container published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`${IMAGE_NAME}:latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit tag: \`${IMAGE_NAME}:sha-${GITHUB_SHA::7}\`" >> "$GITHUB_STEP_SUMMARY"
