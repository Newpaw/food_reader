name: calorie-tracker-local

services:
  app:
    container_name: calorie-tracker-local
    build:
      context: ..
      dockerfile: calorie-tracker/Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend/uploads:/app/calorie-tracker/backend/uploads
      - ../db_folder:/app/data
    ports:
      - "18000:8000"   # backend
      - "18080:8080"   # frontend
