<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Food Reader | History</title>
    <meta name="description" content="Browse, edit, and delete meal entries with a mobile-first history view grouped by day.">
    <meta name="theme-color" content="#d96b3b">
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="assets/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png">
  </head>
  <body data-page="history">
    <div class="app-shell">
      <header class="topbar">
        <div class="topbar-inner">
          <a class="brand" href="index.html">
            <span class="brand-mark">FR</span>
            <span class="brand-copy">
              <strong>Food Reader</strong>
              <small>mobile nutrition log</small>
            </span>
          </a>
          <nav class="desktop-nav" aria-label="Primary">
            <a href="index.html" data-nav="add">Add Meal</a>
            <a href="history.html" data-nav="history">History</a>
            <a href="metrics.html" data-nav="metrics">Metrics</a>
            <a href="profile.html" data-nav="profile">Profile</a>
          </nav>
          <div class="topbar-actions">
            <button class="btn btn-ghost btn-small" data-install-button hidden>Install</button>
            <span class="user-chip"><span data-user-greeting>You</span></span>
            <button class="btn btn-ghost btn-small" data-logout>Log out</button>
          </div>
        </div>
      </header>

      <main class="page">
        <section class="page-hero">
          <p class="eyebrow">History</p>
          <h1>Review the full log, grouped in a way that still works on a phone.</h1>
          <p>Filter a date range, spot outliers quickly, and adjust entries without leaving the history screen.</p>
        </section>

        <section class="panel">
          <form id="historyFilters" class="filter-grid">
            <label class="field">
              <span>From</span>
              <input id="historyFrom" type="date" required>
            </label>
            <label class="field">
              <span>To</span>
              <input id="historyTo" type="date" required>
            </label>
            <button type="submit" class="btn btn-primary">Apply range</button>
          </form>
          <div class="button-row quick-row">
            <button type="button" class="btn btn-secondary btn-small" data-days="0">Today</button>
            <button type="button" class="btn btn-secondary btn-small" data-days="6">Last 7 days</button>
            <button type="button" class="btn btn-secondary btn-small" data-days="29">Last 30 days</button>
            <button type="button" class="btn btn-secondary btn-small" data-days="89">Last 90 days</button>
          </div>
          <p id="historyStatus" class="status" hidden></p>
        </section>

        <section id="historySummary" class="stat-grid"></section>
        <section id="historyList" class="stack"></section>
      </main>

      <nav class="bottom-nav" aria-label="Mobile">
        <a href="index.html" data-nav="add">Add</a>
        <a href="history.html" data-nav="history">History</a>
        <a href="metrics.html" data-nav="metrics">Metrics</a>
        <a href="profile.html" data-nav="profile">Profile</a>
      </nav>
    </div>

    <div id="mealModal" class="modal" hidden>
      <div class="modal-card">
        <button id="closeMealModal" class="modal-close" type="button" aria-label="Close meal details">×</button>
        <div id="mealModalBody" class="stack">
          <img id="modalMealImage" class="modal-image" alt="Meal preview">
          <div>
            <h2 id="modalMealTitle"></h2>
            <p id="modalMealMeta" class="panel-note"></p>
          </div>
          <p id="modalMealNotes"></p>
          <button id="openMealEdit" type="button" class="btn btn-secondary">Edit meal</button>
        </div>

        <form id="mealEditForm" class="stack" hidden>
          <div class="form-grid">
            <label class="field">
              <span>Meal type</span>
              <select id="editMealType" name="mealType">
                <option value="breakfast">Breakfast</option>
                <option value="lunch">Lunch</option>
                <option value="dinner">Dinner</option>
                <option value="snack">Snack</option>
              </select>
            </label>
            <label class="field">
              <span>Calories</span>
              <input id="editCalories" name="calories" type="number" min="0" required>
            </label>
            <label class="field">
              <span>Protein</span>
              <input id="editProtein" name="protein" type="number" min="0">
            </label>
            <label class="field">
              <span>Fat</span>
              <input id="editFat" name="fat" type="number" min="0">
            </label>
            <label class="field">
              <span>Carbs</span>
              <input id="editCarbs" name="carbs" type="number" min="0">
            </label>
            <label class="field">
              <span>Fiber</span>
              <input id="editFiber" name="fiber" type="number" min="0">
            </label>
            <label class="field">
              <span>Sugar</span>
              <input id="editSugar" name="sugar" type="number" min="0">
            </label>
            <label class="field">
              <span>Sodium</span>
              <input id="editSodium" name="sodium" type="number" min="0">
            </label>
            <label class="field">
              <span>Consumed at</span>
              <input id="editConsumedAt" name="consumedAt" type="datetime-local" required>
            </label>
          </div>
          <label class="field">
            <span>Notes</span>
            <textarea id="editNotes" name="notes" rows="4"></textarea>
          </label>
          <button type="submit" class="btn btn-primary">Save meal</button>
        </form>

        <p id="mealModalStatus" class="status" hidden></p>
      </div>
    </div>

    <script type="module" src="history.js"></script>
  </body>
</html>
