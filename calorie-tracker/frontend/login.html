<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Food Reader | Sign In</title>
    <meta name="description" content="Sign in to Food Reader and install the mobile-friendly calorie tracking app on your device.">
    <meta name="theme-color" content="#d96b3b">
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="assets/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png">
  </head>
  <body data-page="login">
    <div class="auth-shell">
      <header class="topbar auth-topbar">
        <div class="topbar-inner">
          <a class="brand" href="login.html">
            <span class="brand-mark">FR</span>
            <span class="brand-copy">
              <strong>Food Reader</strong>
              <small>mobile nutrition log</small>
            </span>
          </a>
          <button class="btn btn-ghost btn-small" data-install-button hidden>Install</button>
        </div>
      </header>

      <main class="auth-page">
        <section class="page-hero auth-hero">
          <p class="eyebrow">Built for real phones</p>
          <h1>Track meals fast, then install the app and keep it on your home screen.</h1>
          <p>The interface is tuned for quick one-handed logging, clear review states, and clean historical reporting.</p>
        </section>

        <div class="auth-grid">
          <section class="panel auth-panel">
            <div class="panel-heading">
              <div>
                <p class="eyebrow">Welcome back</p>
                <h2>Sign in</h2>
              </div>
            </div>
            <form id="loginForm" class="stack">
              <label class="field">
                <span>Email</span>
                <input type="email" name="email" required autocomplete="email">
              </label>
              <label class="field">
                <span>Password</span>
                <input type="password" name="password" required autocomplete="current-password">
              </label>
              <button type="submit" class="btn btn-primary btn-block">Sign in</button>
            </form>
            <p id="loginStatus" class="status" hidden></p>
          </section>

          <section class="panel auth-panel">
            <div class="panel-heading">
              <div>
                <p class="eyebrow">New account</p>
                <h2>Create access</h2>
              </div>
            </div>
            <form id="registerForm" class="stack">
              <label class="field">
                <span>Name</span>
                <input type="text" name="name" required autocomplete="name">
              </label>
              <label class="field">
                <span>Email</span>
                <input type="email" name="email" required autocomplete="email">
              </label>
              <label class="field">
                <span>Password</span>
                <input type="password" name="password" required minlength="6" autocomplete="new-password">
              </label>
              <button type="submit" class="btn btn-secondary btn-block">Create account</button>
            </form>
            <p id="registerStatus" class="status" hidden></p>
          </section>
        </div>
      </main>
    </div>

    <script type="module" src="login.js"></script>
  </body>
</html>
