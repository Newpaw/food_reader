<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Food Reader | Sign In</title>
    <meta name="description" content="Sign in to Food Reader and install the mobile-friendly calorie tracking app on your device.">
    <meta name="theme-color" content="#d96b3b">
    <link rel="stylesheet" href="styles.css?v=20260809-responsive-1">
    <link rel="manifest" href="manifest.webmanifest?v=20260403-11">
    <link rel="apple-touch-icon" href="assets/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png">
  </head>
  <body data-page="login">
    <div class="auth-shell">
      <header class="topbar auth-topbar">
        <div class="topbar-inner">
          <a class="brand" href="login.html">
            <span class="brand-mark">FR</span>
            <span class="brand-copy">
              <strong data-i18n="brand.name">Food Reader</strong>
              <small data-i18n="brand.tagline">mobile nutrition log</small>
            </span>
          </a>
          <div class="topbar-actions">
            <label class="language-picker">
              <span class="sr-only" data-i18n="label.language">Language</span>
              <select data-language-select aria-label="Language">
                <option value="en">EN</option>
                <option value="cs">CZ</option>
              </select>
            </label>
            <button class="btn btn-ghost btn-small" data-install-button hidden data-i18n="button.install">Install</button>
          </div>
        </div>
      </header>

      <main class="auth-page">
        <section class="panel auth-workspace">
          <div class="auth-intro">
            <p class="eyebrow" data-i18n="login.welcomeBack">Welcome back</p>
            <h1 data-i18n="login.signInHeading">Sign in</h1>
            <p class="panel-note" data-i18n="login.signInSupport">Use your saved account to continue quickly.</p>
          </div>

          <div class="segmented-control auth-mode-switch" role="tablist" aria-label="Authentication mode">
            <button
              type="button"
              class="active"
              data-auth-mode-toggle="signin"
              data-auth-heading="login.signInHeading"
              data-auth-eyebrow="login.welcomeBack"
              data-auth-support="login.signInSupport"
              data-i18n="login.signInHeading"
            >Sign in</button>
            <button
              type="button"
              data-auth-mode-toggle="register"
              data-auth-heading="login.createAccess"
              data-auth-eyebrow="login.newAccount"
              data-auth-support="login.createSupport"
              data-i18n="login.createAccess"
            >Create access</button>
          </div>

          <div class="auth-panels">
            <section class="auth-form-panel" data-auth-mode-panel="signin">
              <form id="loginForm" class="stack auth-form">
                <label class="field">
                  <span data-i18n="label.email">Email</span>
                  <input type="email" name="email" required autocomplete="email">
                </label>
                <label class="field">
                  <span data-i18n="label.password">Password</span>
                  <input type="password" name="password" required autocomplete="current-password">
                </label>
                <button type="submit" class="btn btn-primary btn-block" data-i18n="button.signIn">Sign in</button>
              </form>
              <p id="loginStatus" class="status" hidden></p>
              <div class="auth-switch-row">
                <span class="panel-note" data-i18n="login.newHere">New here?</span>
                <button type="button" class="btn btn-ghost btn-small auth-link-button" data-auth-mode-link="register" data-i18n="button.createAccount">Create account</button>
              </div>
            </section>

            <section class="auth-form-panel" data-auth-mode-panel="register" hidden>
              <form id="registerForm" class="stack auth-form">
                <label class="field">
                  <span data-i18n="label.name">Name</span>
                  <input type="text" name="name" required autocomplete="name">
                </label>
                <label class="field">
                  <span data-i18n="label.email">Email</span>
                  <input type="email" name="email" required autocomplete="email">
                </label>
                <label class="field">
                  <span data-i18n="label.password">Password</span>
                  <input type="password" name="password" required minlength="6" autocomplete="new-password">
                </label>
                <button type="submit" class="btn btn-secondary btn-block" data-i18n="button.createAccount">Create account</button>
              </form>
              <p id="registerStatus" class="status" hidden></p>
              <div class="auth-switch-row auth-switch-row-divider">
                <span class="panel-note" data-i18n="login.haveAccount">Already have an account?</span>
                <button type="button" class="btn btn-ghost btn-small auth-link-button" data-auth-mode-link="signin" data-i18n="button.signIn">Sign in</button>
              </div>
            </section>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="login.js?v=20260403-11"></script>
  </body>
</html>
