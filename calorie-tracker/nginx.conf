# Nginx configuration for serving frontend static files

user  www-data;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/manifest+json;

    server {
        listen 8080;
        server_name localhost;
        client_max_body_size 5M;

        root /app/calorie-tracker/frontend;
        index index.html;

        # CORS is handled by FastAPI so that one policy is enforced consistently.
        location ~ ^/(auth|users|me|uploads|api|profile|withings)(/|$) {
            proxy_pass http://localhost:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /service-worker.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            expires -1;
            try_files $uri =404;
        }

        location ~* \.webmanifest$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            expires -1;
            add_header Content-Type "application/manifest+json" always;
            try_files $uri =404;
        }

        location ~* \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            expires -1;
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~* \.svg$ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Content-Type "image/svg+xml" always;
            try_files $uri =404;
        }

        location ~* ^/(?!uploads/).*\.(ico|png|jpg|jpeg|gif|webp|woff|woff2|ttf|eot)$ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        location ~* \.(css|js)$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            expires -1;
            try_files $uri =404;
        }

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self' https://cloudflareinsights.com https://static.cloudflareinsights.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;

        error_page 404 /index.html;
        error_page 500 502 503 504 /index.html;
    }
}
