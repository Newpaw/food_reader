name: food-reader

services:
  app:
    container_name: food-reader
    image: ghcr.io/newpaw/food_reader:latest
    pull_policy: always
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./data/uploads:/app/calorie-tracker/backend/uploads
      - ./data/db:/app/data
    ports:
      - "${BACKEND_PORT:-18000}:8000"
      - "${FRONTEND_PORT:-18080}:8080"
    networks:
      cloudflare:
        aliases:
          - calorie-tracker
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 20s

networks:
  cloudflare:
    external: true
    name: cloudflare
